version: 2

# Every action in .github/workflows is pinned to an exact commit SHA, which stops a
# retagged release from silently changing what runs in CI. The trade-off is that a
# pinned SHA never picks up a security fix on its own, so Dependabot owns bumping them
# (it rewrites the SHA and the trailing `# vX.Y.Z` comment together). Without this,
# pinning would quietly turn into running known-stale actions.
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore"
    # Minor and patch bumps batch into one PR. A major version of an action can change its
    # runtime or inputs, so each one arrives as its own PR instead of sinking the whole batch.
    groups:
      actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # `uv`, not `pip`: CI installs with `uv sync --locked`, which fails when uv.lock is out of date
  # with pyproject.toml. The pip ecosystem edits only pyproject.toml, so every PR it opened failed
  # that check; the uv ecosystem updates pyproject.toml and uv.lock together.
  - package-ecosystem: uv
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore"
    # Only the test, lint and docs tooling is batched, and only for minor and patch bumps.
    # The group is an explicit allowlist rather than `dependency-type: development` because
    # Dependabot counts every `[project.optional-dependencies]` entry as development, which
    # swept the framework extras (redis, openai, haystack, dspy, ...) into a tooling PR. Those
    # extras land in consumers' resolutions, so each one arrives as its own PR, and any range
    # widening there also has to update compatibility.yaml or the drift gate fails.
    groups:
      dev-tooling:
        patterns:
          - "pytest"
          - "pytest-*"
          - "mypy"
          - "ruff"
          - "bandit"
          - "testcontainers"
          - "httpx"
          - "respx"
          - "pyyaml"
          - "sphinx"
          - "furo"
        update-types: ["minor", "patch"]
    ignore:
      # Held below 9 on purpose (see the `dev` extra in pyproject.toml): every
      # pytest-asyncio release from 0.24 on declares `pytest<9`. Remove this entry once
      # pytest-asyncio supports pytest 9.
      - dependency-name: "pytest"
        versions: [">=9"]
    open-pull-requests-limit: 5
