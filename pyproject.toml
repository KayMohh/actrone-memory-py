[project]
name = "actrone-memory"
version = "0.2.1"
description = "Production-grade two-tier persistent memory for AI agents: local-first by default, Redis + Qdrant for scale"
readme = "README.md"
license = "MIT"                    # PEP 639 SPDX expression
license-files = ["LICENSE"]
authors = [{ name = "Apocalypse Technologies", email = "hello@actrone.com" }]
keywords = [
    "agent-memory", "ai-agents", "memory", "long-term-memory", "semantic-search", "rag", "llm",
    "langchain", "langgraph", "crewai", "autogen", "llamaindex", "haystack", "dspy", "agno",
    "qdrant", "redis", "pgvector", "ai", "agents",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Framework :: AsyncIO",
    "Framework :: Pydantic :: 2",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    # redis / qdrant-client / openai are NOT base deps: the default backend is the
    # zero-service in-memory + hashing path, so `pip install actrone-memory` pulls none of them.
    # Install the `redis` / `qdrant` / `openai` extras (or `production`) for the durable backend.
    "structlog>=24.1,<25",
    # tiktoken is not a base dep either: the default token counter is a dependency-free heuristic
    # with no network access. The `tiktoken` extra enables exact counts (token_counter="tiktoken").
    "tenacity>=8.3,<10",
    "prometheus-client>=0.20,<1",
    # Pinned explicitly: pydantic + structlog both pull it transitively and the
    # API surface (NotRequired, Self, TypeAliasType) is load-bearing for our
    # type annotations.
    "typing-extensions>=4.12,<5",
]

[project.scripts]
# Non-destructive onboarding CLI, the Python counterpart of `npx actrone-memory add`.
actrone-memory = "actrone_memory.cli:main"

[project.optional-dependencies]
# the durable-backend / managed-embedding dependencies as opt-in extras (kept out of the
# local-first base install). `production` is the convenience bundle for the redis_qdrant backend.
redis       = ["redis[hiredis]>=5.0,<6"]
qdrant      = ["qdrant-client>=1.9,<2"]
# Postgres + pgvector as the long-term tier: no new service for teams already on Postgres.
pgvector    = ["asyncpg>=0.29,<1"]
openai      = ["openai>=1.30,<3"]
# Exact cl100k_base token counts (token_counter="tiktoken"); downloads the encoding once on first use.
tiktoken    = ["tiktoken>=0.7,<1"]
production  = ["actrone-memory[redis]", "actrone-memory[qdrant]", "actrone-memory[openai]"]
# Widened to span 0.x AND the 1.x majors these frameworks shipped in 2026: the adapters
# target stable, long-lived interfaces (StateGraph, llama-index-core Memory), so the pre-1.0 caps
# would have forced users off their current 1.x installs. langchain now spans both majors too:
# 1.x dropped `langchain_core.memory`, so ActroneMemory is 0.x-only and ActroneChatMessageHistory
# (on `chat_history`, identical in both) carries Tier 2 forward. Capping at <1 would instead pin
# users to a 0.3.x line whose advisories are only fixed in 1.x.
# Ranges are SSOT'd in compatibility.yaml; check_compat.py gates drift.
langchain   = ["langchain>=0.2,<3", "langchain-core>=0.2,<3"]
langgraph   = ["langgraph>=0.1,<2"]
crewai      = ["crewai>=0.95,<2"]
autogen     = ["autogen-agentchat>=0.4.3,<1", "autogen-core>=0.4.3,<1"]
llamaindex  = ["llama-index-core>=0.10,<2"]
haystack    = ["haystack-ai>=2.0,<4"]
dspy        = ["dspy>=2.5,<4"]
agno        = ["agno>=1.0,<4"]
smolagents  = ["smolagents>=1.5.1,<2"]
strands     = ["strands-agents>=1.0,<2"]
openai_agents             = ["openai-agents>=0.2,<1"]
pydantic_ai               = ["pydantic-ai>=1.32,<3"]
claude_agent_sdk          = ["claude-agent-sdk>=0.1,<1"]
semantic_kernel           = ["semantic-kernel>=1.16,<2"]
google_adk                = ["google-adk>=1.2,<3"]
microsoft_agent_framework = ["agent-framework-core>=1.0,<2"]
# In-process ONNX dense embedder (onnxruntime, no torch), the preferred "local" recall tier.
onnx        = ["fastembed>=0.7,<1"]
# sentence-transformers is the heavier torch-backed local tier (second in the graceful chain).
local       = ["sentence-transformers>=3.0,<4", "torch>=2.3"]
all = [
    "actrone-memory[langchain]",
    "actrone-memory[langgraph]",
    "actrone-memory[crewai]",
    "actrone-memory[autogen]",
    "actrone-memory[llamaindex]",
    "actrone-memory[haystack]",
    "actrone-memory[dspy]",
    "actrone-memory[agno]",
    "actrone-memory[smolagents]",
    "actrone-memory[strands]",
    "actrone-memory[openai_agents]",
    "actrone-memory[pydantic_ai]",
    "actrone-memory[claude_agent_sdk]",
    "actrone-memory[semantic_kernel]",
    "actrone-memory[google_adk]",
    "actrone-memory[microsoft_agent_framework]",
    "actrone-memory[production]",
    "actrone-memory[onnx]",
    "actrone-memory[local]",
    "actrone-memory[tiktoken]",
]
dev = [
    # Held at <9 deliberately, NOT an oversight. PYSEC-2026-1845 (predictable
    # /tmp/pytest-of-{user} directories on UNIX, local DoS or privilege escalation) is
    # only fixed in pytest 9.0.3, but every pytest-asyncio release from 0.24 onward
    # declares `pytest<9`. Moving to 9 resolves pytest-asyncio back to 0.23.3, whose
    # looser pin merely permits pytest 9 without being tested against it, which is a bad
    # trade for an async library's entire test suite. Dev-only (consumers never install
    # it) and it needs a local account on a shared host to exploit. Revisit as soon as
    # pytest-asyncio supports pytest 9.
    "pytest>=8.2,<9",
    "pytest-asyncio>=0.23,<1",
    "pytest-cov>=5.0,<6",
    # CI's integration job runs with --timeout, so a test stuck on Redis or Qdrant fails instead of
    # holding the runner until GitHub's 6-hour job limit.
    "pytest-timeout>=2.3,<3",
    "mypy>=1.10,<2",
    "ruff>=0.4,<1",
    "testcontainers[redis,qdrant]>=4.7,<5",
    "httpx>=0.27,<1",
    "respx>=0.21,<1",
    "bandit>=1.7,<2",
    "pyyaml>=6.0,<7",  # compat drift-gate + interface canaries (scripts/check_compat.py)
    # OpenAIEmbedder/FactExtractor unit tests (test_embedder.py, test_extraction.py) and
    # mypy strict-mode import resolution both need the real `openai` package on the path even
    # though it's an opt-in extra for end users. Without this, `pip install -e ".[dev]"`
    # (what CI's test-unit job runs) leaves those tests failing on ImportError.
    "openai>=1.30,<3",
]
# API-reference generation. Sphinx autodoc renders the reference from the package source.
# Build: `sphinx-build -b html docs docs/_build/html`.
docs = [
    "sphinx>=9,<10",
    "furo>=2025.12",
]

[project.urls]
Homepage = "https://actrone.com"
Repository = "https://github.com/actrone/actrone-memory-py"
Documentation = "https://actrone.com/docs/memory/overview"
Issues = "https://github.com/actrone/actrone-memory-py/issues"
Changelog = "https://github.com/actrone/actrone-memory-py/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling>=1.27"] # >=1.27 for PEP 639 SPDX license + license-files support
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/actrone_memory"]

# Hatchling's sdist otherwise ships everything git tracks, which here means the test suite, docs,
# examples, media and CI config: megabytes that no installing user can run. Excluding rather than
# including keeps `src/`, README, LICENSE and CHANGELOG in by default, so the sdist stays buildable
# and PEP 517 installable while carrying only what it needs to build the wheel.
[tool.hatch.build.targets.sdist]
exclude = [
  "/.github",
  "/ci",
  "/docs",
  "/examples",
  "/media",
  "/scripts",
  "/tests",
  "/dist",
  "/.pre-commit-config.yaml",
  "/.env.example",
  "/compatibility.yaml",
  "/uv.lock",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.format]
# Generated by scripts/extract_snippets.py, which owns its layout. CI's snippet check compares the
# file byte for byte with the generator's output, so reformatting it would read as drift.
exclude = ["src/actrone_memory/_example_snippets.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "ASYNC", "S", "B", "A", "C4", "RET", "SIM", "TCH", "PTH"]
# S101, allow assert in tests.
# A002, integration adapters mirror upstream framework signatures (e.g. LlamaIndex
#        `input`); renaming would break drop-in compatibility.
# TC001/TC002/TC003, pydantic v2 resolves annotations at runtime (model_validate),
#        so hoisting typing imports into a TYPE_CHECKING block breaks validation.
ignore = ["S101", "A002", "TC001", "TC002", "TC003"]

[tool.ruff.lint.per-file-ignores]
# Contract tests gate framework-dependent imports behind `pytest.importorskip(...)`, which is a
# statement before the imports, E402 is intentional and idiomatic for this pattern.
"tests/contract/*" = ["E402"]
# S608: SQL identifiers cannot be bind parameters, so the table name is interpolated. The ONLY
# interpolated values are the table name and the vector width, both validated at construction
# (`_validate_identifier`, an allowlist charset). Every caller-supplied value is a bind
# parameter. Suppressed here rather than per-line because the diagnostics land on multi-line
# f-strings, where an inline `# noqa` would become part of the SQL.
"src/actrone_memory/l2/pgvector_store.py" = ["S608"]
"src/actrone_memory/l1/postgres_store.py" = ["S608"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]

# Optional integration packages (langchain, langgraph, crewai, etc.) ship
# their own stubs but are not installed in the base venv. Suppress
# import-not-found for the integration adapters that live behind the
# optional-dependency gate. The adapters themselves are type-annotated so
# the rest of the codebase benefits from strict checking even here.
[[tool.mypy.overrides]]
module = [
    "actrone_memory.integrations.*",
    "langchain_core.*",
    "langgraph.*",
    "crewai.*",
    "autogen_core.*",
    "haystack.*",
    "dspy.*",
    "llama_index.*",
    "agent_framework.*",
    "google.adk.*",
    "google.genai.*",
    "sentence_transformers.*",
    "torch.*",
    "fastembed.*",
    "tiktoken.*",
    "mem0.*",
    "zep_cloud.*",
    "letta_client.*",
    "redis.*",
    "qdrant_client.*",
    "asyncpg.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=actrone_memory --cov-report=term-missing --cov-fail-under=80"
markers = [
    "integration: tests that require external services (Redis, Qdrant) via testcontainers",
]

[tool.coverage.run]
source = ["src/actrone_memory"]
# Integration adapters ship their own test suites per-framework (e.g.
# langchain contract tests). Exclude from unit coverage so the threshold
# measures the core library, not framework glue.
omit = ["*/integrations/*"]
